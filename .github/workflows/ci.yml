name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Server + multiplayer harness, client protocol, UI and scene tests
        run: npm run test:all
      - name: Browser smoke test (Chromium)
        run: |
          npm i -D puppeteer
          npx puppeteer browsers install chrome
          npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
